[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varipath"
version = "0.1.0"
description = "Exact finite-map free-energy transport with saddle-anchored fields"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "torch==2.14.0",
  "openmm==8.5.2",
  "h5py==3.16.0",
  "pymbar==4.0.3",
  "ase==3.29.0",
  "mpmath==1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
cuda = ["openmm[cuda12]==8.5.2"]

[project.scripts]
varipath = "varipath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
varipath = ["assets/**/*", "baselines/FEAT-LICENSE", "LICENSE.openmmtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
